name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: make app

      - name: Sign app (ad-hoc)
        run: codesign --force --deep --sign - --options runtime build/ThemeSync.app

      - name: Create zip
        run: zip -r ThemeSync.app.zip ThemeSync.app
        working-directory: build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          **ThemeSync** — a tiny macOS menu bar app that runs shell scripts when macOS switches between Light and Dark mode.

          ## Install
          1. Download `ThemeSync.app.zip` below
          2. Unzip and drag `ThemeSync.app` to `/Applications`
          3. Right-click → **Open** on first launch (ad-hoc signed, no Apple Developer ID)

          Requires macOS 13.0+ (Apple Silicon).
          EOF
          )" \
            build/ThemeSync.app.zip
